set -g mouse on
set -g focus-events on


set -g history-limit 100000


set -sg escape-time 0
set -g repeat-time 1000
set -g status-interval 5


# unbind C-b
# set -g prefix `
# bind ` send-prefix
set -g prefix C-b


set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"


# Better colours
set -g default-terminal "screen-256color"
set -sg terminal-overrides ",*:RGB"


# Theme: borders
set -g pane-border-lines single
set -g pane-border-style fg=white,bright
set -g pane-active-border-style fg=green

# Theme: status
set -g status-style bg=default,fg=white
set -g status-justify left
set -g status-left ""
set -g status-right "#{?session_name, #S/,}#W    %Y-%m-%d %H:%M"

# Theme: status (windows)
set -g window-status-format "●"
set -g window-status-current-format "●"

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=green\#,nobold}"
set -g window-status-bell-style "fg=red,nobold"

# Theme: command prompt
set -g message-command-style "fg=white,bg=black,bold"
set -g message-style "fg=default,bg=default"


# Index from 1
set -g base-index 1
setw -g pane-base-index 1


# Vim keys
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+


# Panes
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload on "r"
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

